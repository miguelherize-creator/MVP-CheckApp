services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: walvy
      POSTGRES_PASSWORD: walvy
      POSTGRES_DB: walvy
    ports:
      - '5433:5432'
    volumes:
      - walvy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U walvy -d walvy']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://walvy:walvy@postgres:5432/walvy
      PORT: "3000"    
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  walvy_pg_data:
